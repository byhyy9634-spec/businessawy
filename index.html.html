<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Businessawy | بيزنساوي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#161a34;
    --navy-2:#232951;
    --magenta:#e6217e;
    --cyan:#28abe3;
    --yellow:#fbc417;
    --orange:#f4901e;

    /* comfortable, non-stark background system (tinted cool porcelain, not plain white) */
    --bg:#e7eef2;
    --bg-soft:#dde8ed;
    --paper:#f5f9fb;
    --paper-raised:#fbfdfe;

    --ink:#1c2036;
    --ink-soft:#5c6178;
    --line:#d7e2e7;
    --radius:18px;
    --shadow: 0 12px 28px -16px rgba(22,26,52,.30);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;}
  :focus-visible{outline:2.5px solid var(--cyan);outline-offset:2px;}

  /* ---------- top arc band ---------- */
  .arc-band{
    height:7px;
    background:linear-gradient(90deg, var(--magenta) 0 25%, var(--cyan) 25% 50%, var(--orange) 50% 75%, var(--yellow) 75% 100%);
  }

  /* ---------- hero ---------- */
  .hero{
    text-align:center;
    padding:34px 20px 26px;
    background:
      radial-gradient(90% 70% at 12% -15%, rgba(230,33,126,.22), transparent 55%),
      radial-gradient(90% 70% at 88% -10%, rgba(40,171,227,.22), transparent 55%),
      radial-gradient(70% 60% at 50% 105%, rgba(251,196,23,.20), transparent 60%),
      var(--paper);
    border-bottom:1px solid var(--line);
  }
  .logo-wrap{
    width:138px;
    height:138px;
    margin:0 auto 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:floatY 4s ease-in-out infinite;
  }
  .logo-wrap img{width:100%;height:100%;object-fit:contain;}
  @keyframes floatY{
    0%,100%{transform:translateY(0) scale(1) rotate(0deg);}
    50%{transform:translateY(-12px) scale(1.035) rotate(-1.5deg);}
  }
  .hero h1{
    font-size:25px;
    font-weight:800;
    letter-spacing:.3px;
    margin:0 0 6px;
    color:var(--navy);
    opacity:0;
    animation:heroIn .6s ease .1s forwards;
  }
  .hero p.tagline{
    margin:0 auto;
    max-width:320px;
    color:var(--ink-soft);
    font-size:14px;
    font-weight:500;
    min-height:44px;
    animation:taglineFloat 3.4s ease-in-out .9s infinite;
  }
  .hero p.tagline .cursor{
    display:inline-block;
    width:2px;
    height:14px;
    background:var(--cyan);
    margin-inline-start:2px;
    vertical-align:middle;
    animation:cursorBlink .8s steps(1) infinite;
  }
  .hero p.tagline .cursor.done{display:none;}
  @keyframes taglineFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-3px);}
  }
  @keyframes cursorBlink{
    0%,49%{opacity:1;}
    50%,100%{opacity:0;}
  }
  @keyframes heroIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- category pills ---------- */
  .cat-nav{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(231,238,242,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:12px 14px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:999px;
    background:var(--paper-raised);
    border:1.5px solid var(--line);
    color:var(--ink-soft);
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition:background .25s ease, color .25s ease, border-color .25s ease, transform .15s ease;
  }
  .cat-pill:active{transform:scale(.93);}
  .cat-pill.active{
    background:var(--accent, var(--navy));
    border-color:var(--accent, var(--navy));
    color:var(--accent-text, #fff);
  }
  .cat-pill.pop{animation:pillPop .38s ease;}
  @keyframes pillPop{
    0%{transform:scale(1);}
    45%{transform:scale(1.1);}
    100%{transform:scale(1);}
  }

  /* ---------- sections ---------- */
  main{max-width:520px;margin:0 auto;padding:22px 16px 60px;}
  .section{margin-bottom:32px;}
  .section-head{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:space-between;
    margin-bottom:14px;
    padding:0 2px;
  }
  .section-head .title-group{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .section-head .bar{
    width:7px;
    height:24px;
    border-radius:99px;
    flex:0 0 auto;
  }
  .section-head h2{
    font-size:18px;
    font-weight:800;
    color:#aab0bf;
    margin:0;
  }
  .section-head span{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:700;
    background:var(--paper-raised);
    border:1px solid var(--line);
    padding:3px 10px;
    border-radius:99px;
    flex:0 0 auto;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-top:4px solid var(--accent, var(--cyan));
    border-radius:var(--radius);
    padding:14px;
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow);
    opacity:0;
    transform:translateY(16px);
    transition:opacity .5s ease, transform .5s ease, box-shadow .2s ease;
    transition-delay:var(--delay, 0ms);
  }
  .card.in-view{opacity:1; transform:translateY(0);}
  .card-top{
    margin-bottom:6px;
  }
  .card-media{
    width:100%;
    height:104px;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:10px;
    background:var(--accent-bg, rgba(0,0,0,.06));
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:scale(.92);
    transition:opacity .5s ease, transform .5s cubic-bezier(.34,1.56,.64,1);
    transition-delay:calc(var(--delay, 0ms) + 90ms);
  }
  .card.in-view .card-media{opacity:1; transform:scale(1);}
  .card-media img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .4s ease;
  }
  .card-icon{
    width:32px;
    height:32px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    opacity:0;
    transform:scale(.4) rotate(-18deg);
    transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .35s ease, background .2s ease;
  }
  .card.in-view .card-icon{
    opacity:1;
    transform:scale(1) rotate(0deg);
    transition-delay:calc(var(--delay, 0ms) + 120ms);
  }
  .card-icon svg{width:18px;height:18px;}
  .card h3{
    font-size:14px;
    font-weight:700;
    margin:2px 0 0;
    color:var(--ink);
  }
  .card p.desc{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 10px;
    min-height:30px;
  }
  .price-row{margin:0 0 10px;}
  .price .now{
    font-size:15px;
    font-weight:800;
    color:var(--navy);
  }
  .price .was{
    font-size:11px;
    color:#9aa2b4;
    text-decoration:line-through;
    margin-inline-start:6px;
  }
  .price .quote{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .badge{
    display:inline-block;
    font-size:10.5px;
    font-weight:800;
    color:#fff;
    background:var(--orange);
    padding:2px 8px;
    border-radius:99px;
    margin-inline-end:6px;
    vertical-align:middle;
    animation:badgePulse 2.4s ease-in-out infinite;
  }
  @keyframes badgePulse{
    0%,100%{box-shadow:0 0 0 0 rgba(244,144,30,.45);}
    50%{box-shadow:0 0 0 5px rgba(244,144,30,0);}
  }
  .order-btn{
    margin-top:auto;
    width:100%;
    border:none;
    border-radius:12px;
    padding:10px;
    background:var(--accent, var(--cyan));
    color:var(--accent-text, #fff);
    font-size:13.5px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 16px -8px var(--accent, var(--cyan));
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), filter .15s ease, box-shadow .2s ease;
  }
  .order-btn:active{transform:scale(.94);filter:brightness(.94);}
  @media (hover:hover){
    .card{transition:opacity .5s ease, transform .5s ease, box-shadow .25s ease, border-color .25s ease;}
    .card:hover{box-shadow:0 16px 34px -16px rgba(22,26,52,.38); transform:translateY(-3px);}
    .card.in-view:hover{transform:translateY(-3px);}
    .card:hover .card-icon{transform:scale(1.14) rotate(-8deg); transition-delay:0ms;}
    .card:hover .card-media img{transform:scale(1.08);}
    .order-btn:hover{transform:translateY(-2px); filter:brightness(1.05); box-shadow:0 14px 24px -10px var(--accent, var(--cyan));}
    .contact-row:hover{transform:translateY(-2px); box-shadow:0 16px 28px -16px rgba(22,26,52,.35);}
    .contact-row:hover .c-icon{transform:scale(1.15) rotate(8deg);}
  }

  /* ---------- sheet / modal ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(15,17,32,.5);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:40;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    max-width:520px;
    margin:0 auto;
    background:var(--paper-raised);
    border-radius:24px 24px 0 0;
    max-height:88vh;
    display:flex;
    flex-direction:column;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);
    z-index:41;
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{
    width:40px;height:4px;border-radius:99px;
    background:var(--line);
    margin:12px auto 6px;
  }
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .sheet-head h3{font-size:17px;margin:0;font-weight:800;color:var(--navy);}
  .close-x{
    width:32px;height:32px;border-radius:50%;
    border:none;background:var(--bg);
    font-size:16px;cursor:pointer;color:var(--ink-soft);
  }
  .sheet-body{
    padding:16px 20px;
    overflow-y:auto;
  }
  .selected-product{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:6px;
  }
  .selected-product .card-icon{width:40px;height:40px;border-radius:12px;}
  .selected-product .card-icon svg{width:22px;height:22px;}
  .selected-product .info b{
    display:block;font-size:14.5px;color:var(--ink);font-weight:800;
  }
  .selected-product .info span{font-size:12.5px;color:var(--ink-soft);}

  .field{margin-top:16px;}
  .field label{
    display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-size:14px;
    font-family:inherit;
    background:var(--bg);
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:64px;}
  .field input:focus, .field textarea:focus{
    outline:none;border-color:var(--cyan);background:var(--paper-raised);
  }
  .field .err{
    display:none;
    color:#c9435f;font-size:11.5px;margin-top:5px;font-weight:600;
  }
  .field.invalid input{border-color:#c9435f;}
  .field.invalid .err{display:block;}
  .sheet-foot{
    padding:14px 20px 22px;
    border-top:1px solid var(--line);
  }
  .send-btn{
    width:100%;
    background:#25D366;
    color:#fff;
    border:none;
    border-radius:14px;
    padding:15px;
    font-size:15.5px;
    font-weight:800;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .send-btn:active{transform:scale(.98);}
  .send-btn.sent{background:#1fae54;}

  @media (prefers-reduced-motion: reduce){
    .logo-wrap{animation:none;}
    .hero h1{animation:none; opacity:1;}
    .hero p.tagline{animation:none;}
    .cursor{animation:none; display:none;}
    .card, .contact-row{opacity:1; transform:none; transition:none;}
    .card-icon{opacity:1; transform:none; transition:none;}
    .badge{animation:none;}
    .cat-pill.pop{animation:none;}
    .tap-fx, .tap-fx::after{animation:none;}
  }

  /* ---------- unified button shine + tap feedback ---------- */
  .order-btn, .send-btn, .cat-pill, .contact-row, .close-x{
    position:relative;
    overflow:hidden;
    isolation:isolate;
  }
  .order-btn::after, .send-btn::after, .cat-pill::after, .contact-row::after, .close-x::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%);
    transform:translateX(-130%);
    opacity:0;
    pointer-events:none;
  }
  .tap-fx{animation:tapPulse .4s ease;}
  .tap-fx::after{animation:shineSweep .55s ease;}
  @keyframes tapPulse{
    0%{transform:scale(1);}
    40%{transform:scale(.94);}
    100%{transform:scale(1);}
  }
  @keyframes shineSweep{
    0%{transform:translateX(-130%); opacity:1;}
    100%{transform:translateX(130%); opacity:0;}
  }
  @media (hover:hover){
    .order-btn:hover::after, .send-btn:hover::after, .cat-pill:hover::after, .contact-row:hover::after{
      transform:translateX(130%);
      opacity:1;
      transition:transform .7s ease, opacity .7s ease;
    }
  }

  footer{
    text-align:center;
    padding:22px 20px 40px;
    color:var(--ink-soft);
    font-size:12px;
  }  .contact-section{
    max-width:520px;
    margin:0 auto;
    padding:6px 16px 30px;
  }
  .contact-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .contact-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-inline-start:4px solid var(--accent, var(--cyan));
    border-radius:14px;
    padding:12px 14px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:var(--shadow);
    transition:transform .15s ease, opacity .5s ease;
    opacity:0;
    transform:translateY(14px);
    transition-delay:var(--delay, 0ms);
  }
  .contact-row.in-view{opacity:1; transform:translateY(0);}
  .contact-row:active{transform:scale(.98);}
  .contact-row .c-icon{
    width:38px;
    height:38px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    background:var(--accent-bg, rgba(40,171,227,.14));
    color:var(--accent, var(--cyan));
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .contact-row .c-icon svg{width:20px;height:20px;}
  .contact-row .c-info{flex:1;min-width:0;}
  .contact-row .c-info b{
    display:block;font-size:14px;font-weight:800;
  }
  .contact-row .c-info span{
    display:block;font-size:12px;color:var(--ink-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .contact-row .c-arrow{
    flex:0 0 auto;
    color:var(--ink-soft);
    font-size:15px;
  }
</style>
</head>

function renderContacts(){

  wrap.innerHTML = CONTACT_LINKS.map((c,i) => `

/* ============ RENDER ============ */
function renderNav(){
  const nav = document.getElementById('catNav');
  nav.innerHTML = CATEGORIES.map((c,i) =>
    `<button class="cat-pill${i===0?' active':''}" style="--accent:${iconColor(c.accent)};--accent-text:${accentText(c.accent)}" data-cat="${c.id}" onclick="jumpTo('${c.id}', this)">${c.name}</button>`
  ).join('');
}

function renderCatalog(){
  const main = document.getElementById('catalog');
  main.innerHTML = CATEGORIES.map(cat => {
    const items = PRODUCTS.filter(p => p.cat === cat.id);
    return `
    <section class="section" id="sec-${cat.id}">
      <div class="section-head">
        <div class="title-group">
          <span class="bar" style="background:${iconColor(cat.accent)};box-shadow:0 0 0 4px ${iconBg(cat.accent)}"></span>
          <h2>${cat.name}</h2>
        </div>
        <span>${items.length} منتج</span>
      </div>
      <div class="grid">
        ${items.map((p,i) => renderCard(p,i)).join('')}
      </div>
    </section>`;
  }).join('');
  initReveal();
}

function renderCard(p, index){
  const cat = CATEGORIES.find(c => c.id === p.cat);
  const colorKey = cat.accent;
  const priceHtml = p.price
    ? `<div class="price">
         ${p.was ? `<span class="badge">خصم</span>` : ''}
         <span class="now">${p.price} ج.م</span>
         ${p.was ? `<span class="was">${p.was} ج.م</span>` : ''}
       </div>`
    : `<div class="price"><span class="quote">السعر عند الطلب</span></div>`;
  const delay = (index % 6) * 60;
  const photo = PRODUCT_IMAGES[p.id];
  const mediaHtml = photo
    ? `<img src="${photo}" alt="${p.name}" loading="lazy">`
    : `<span class="card-icon" style="background:transparent;color:${iconColor(colorKey)}">
         <svg viewBox="0 0 24 24">${ICONS[p.icon] || ICONS.card}</svg>
       </span>`;
  return `
    <div class="card" style="--accent:${iconColor(colorKey)};--accent-text:${accentText(colorKey)};--delay:${delay}ms">
      <div class="card-media" style="background:${iconBg(colorKey)}">${mediaHtml}</div>
      <div class="card-top">
        <h3>${p.name}</h3>
      </div>
      <p class="desc">${p.desc}</p>
      <div class="price-row">${priceHtml}</div>
      <button class="order-btn" onclick="openOrder('${p.id}')">اطلب الآن</button>
    </div>`;
}

/* ============ SCROLL REVEAL ============ */
let revealObserver = null;
function initReveal(){
  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.card, .contact-row').forEach(el => el.classList.add('in-view'));
    return;
  }
  if(!revealObserver){
    revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('in-view');
          revealObserver.unobserve(entry.target);
        }
      });
    }, {threshold:0.12, rootMargin:'0px 0px -40px 0px'});
  }
  document.querySelectorAll('.card:not(.in-view), .contact-row:not(.in-view)').forEach(el => revealObserver.observe(el));
}

/* ============ NAV SCROLL ============ */
function jumpTo(catId, el){
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  el.classList.add('pop');
  setTimeout(() => el.classList.remove('pop'), 380);
  const sec = document.getElementById('sec-'+catId);
  if(sec){
    const y = sec.getBoundingClientRect().top + window.scrollY - 66;
    window.scrollTo({top:y, behavior:'smooth'});
  }
}

/* ============ ORDER SHEET (single product, KILY-style) ============ */
function openOrder(id){
  currentProduct = PRODUCTS.find(p => p.id === id);
  const cat = CATEGORIES.find(c => c.id === currentProduct.cat);
  const priceText = currentProduct.price ? `${currentProduct.price} ج.م` : 'السعر عند الطلب';
  const photo = PRODUCT_IMAGES[currentProduct.id];
  const mediaHtml = photo
    ? `<img src="${photo}" alt="${currentProduct.name}" style="width:100%;height:100%;object-fit:cover;">`
    : `<svg viewBox="0 0 24 24">${ICONS[currentProduct.icon] || ICONS.card}</svg>`;

  document.getElementById('selectedProduct').innerHTML = `
    <span class="card-icon" style="background:${iconBg(cat.accent)};color:${iconColor(cat.accent)};overflow:hidden;">
      ${mediaHtml}
    </span>
    <div class="info">
      <b>${currentProduct.name}</b>
      <span>${priceText}</span>
    </div>`;

  document.getElementById('custName').value = '';
  document.getElementById('custPhone').value = '';
  document.getElementById('custNotes').value = '';
  document.getElementById('fieldName').classList.remove('invalid');
  document.getElementById('fieldPhone').classList.remove('invalid');

  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}

/* ============ VALIDATION + SEND ============ */
function validateEgyptPhone(v){
  return /^01[0125][0-9]{8}$/.test(v.trim());
}

function sendOrder(){
  if(!currentProduct) return;
  const nameEl = document.getElementById('custName');
  const phoneEl = document.getElementById('custPhone');
  const notesEl = document.getElementById('custNotes');
  const fieldName = document.getElementById('fieldName');
  const fieldPhone = document.getElementById('fieldPhone');

  const name = nameEl.value.trim();
  const phone = phoneEl.value.trim();
  const notes = notesEl.value.trim();

  let valid = true;
  if(!name){ fieldName.classList.add('invalid'); valid = false; }
  else{ fieldName.classList.remove('invalid'); }

  if(!validateEgyptPhone(phone)){ fieldPhone.classList.add('invalid'); valid = false; }
  else{ fieldPhone.classList.remove('invalid'); }

  if(!valid) return;

  const priceText = currentProduct.price ? `${currentProduct.price} ج.م` : 'السعر عند الطلب';
  let msg = `مرحباً Businessawy 👋\nعايز أطلب: ${currentProduct.name}\nالسعر: ${priceText}\n\nالاسم: ${name}\nالتليفون: ${phone}`;
  if(notes) msg += `\nتفاصيل إضافية: ${notes}`;

  const url = `https://wa.me/201034113006?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');

  const sendBtn = document.getElementById('sendBtn');
  const originalText = sendBtn.textContent;
  sendBtn.classList.add('sent');
  sendBtn.textContent = 'تم إرسال الطلب ✓';
  setTimeout(() => {
    closeSheet();
    sendBtn.classList.remove('sent');
    sendBtn.textContent = originalText;
  }, 700);
}

/* ============ INIT ============ */
renderNav();
renderCatalog();
renderContacts();
typeTagline();
setupTapFx();

/* ============ TAGLINE TYPEWRITER ============ */
function typeTagline(){
  const full = 'للخدمات الإلكترونية والدعاية والإعلان — اختار المنتج اللي محتاجه واطلبه في خطوة واحدة';
  const el = document.getElementById('typedText');
  const cursor = document.getElementById('taglineCursor');
  if(!el) return;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion){
    el.textContent = full;
    if(cursor) cursor.classList.add('done');
    return;
  }
  let i = 0;
  const speed = 14; // fast typing
  (function step(){
    if(i <= full.length){
      el.textContent = full.slice(0, i);
      i++;
      setTimeout(step, speed);
    }else if(cursor){
      cursor.classList.add('done');
    }
  })();
}

/* ============ SHARED TAP / HOVER SHINE ============ */
function setupTapFx(){
  document.addEventListener('click', (e) => {
    const el = e.target.closest('.order-btn, .send-btn, .cat-pill, .contact-row, .close-x');
    if(!el) return;
    el.classList.remove('tap-fx');
    void el.offsetWidth;
    el.classList.add('tap-fx');
    setTimeout(() => el.classList.remove('tap-fx'), 550);
  });
}
</script>
